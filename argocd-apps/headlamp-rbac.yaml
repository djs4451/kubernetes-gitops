apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp-rbac
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/djs4451/kubernetes-gitops.git
    targetRevision: main
    path: headlamp/rbac

  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
